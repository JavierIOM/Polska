# Polska orchestrator config.
#
# Tunables only. No credentials: those come from the environment, see .env.example.
# Validated on load by polska.config.appconfig.AppConfig, so a typo fails at startup
# rather than at 3am on the fourth tick.

scheduler:
  enabled: true
  # Daily. How often the business actually changes is the question that decides
  # this, not the per-tick cost: measured, an idle tick and a working one are both
  # cheap enough that the interval was never a budget decision.
  interval_hours: 24
  jitter_seconds: 300
  run_on_start: false
  coalesce: true

limits:
  max_concurrent_tasks: 2
  max_tasks_per_day: 12
  max_tasks_per_tick: 5
  # A task failing this many times is abandoned rather than requeued. It can
  # also be abandoned sooner than this on cost: see budget.max_usd_per_task.
  max_attempts: 3
  task_timeout_seconds: 900
  # Wall-clock backoff before a failed task is eligible for another attempt,
  # measured from the task's own last transition, not a count of ticks:
  # min(retry_base_delay_seconds * retry_backoff_multiplier ** (attempts - 1),
  # retry_max_delay_seconds). 15 minutes, then 30, capped at one tick (4h).
  retry_base_delay_seconds: 900
  retry_backoff_multiplier: 2.0
  retry_max_delay_seconds: 14400

budget:
  # Hard stops. Crossing one halts the scheduler and writes a BudgetHalt row.
  # Nothing degrades, nothing retries past a limit.
  #
  # Denominated in dollars, not tokens: an Opus token and a Haiku token do not
  # cost the same, so a raw cross-model token sum would make a ceiling
  # meaningless. max_tokens_per_run is the one token figure left, and it is a
  # same-model, single-run output-size safety net, never used to price anything.
  max_tokens_per_run: 200000
  max_usd_per_run: 3.0
  # limits.max_attempts bounds retries, not spend. On Opus, max_attempts alone
  # could let one broken task cost most of a day's budget. This catches that
  # independently of how many attempts it has used.
  max_usd_per_task: 6.0
  max_usd_per_day: 10.0
  max_usd_per_company: 250.0
  # Frozen into each run at write time so a rate change never rewrites history.
  usd_to_gbp: 0.79

dedup:
  lookback_days: 14
  high_threshold: 90
  low_threshold: 60
  judge_model: claude-haiku-4-5
  judge_enabled: true

approvals:
  # Anything on this list writes a preview and stops. It never executes directly.
  irreversible_actions:
    - email.send
    - social.publish
    - git.push_default_branch
    - payment.charge
    - contact.third_party
  # Ships empty on purpose. Adding an entry here is a decision to let an agent act
  # on the world without being asked. Every entry must also appear above.
  auto_approve: []
  expiry_hours: 72
  # An action type nobody classified is treated as irreversible. Fail closed.
  unknown_action_is_irreversible: true

integrations:
  default_adapter: dry_run
  # Global off switch. While true, an approved action is still only logged.
  # Phase 1 has no real adapters, so this stays true until they exist.
  force_dry_run: true

agents:
  # Every agent names its model and its tool allowlist explicitly. No agent
  # inherits a tool, and an empty list means it reasons but touches nothing.
  #
  # Model tiers set by Javier on 24 Sep 2026: Opus everywhere was the safe first
  # default, but not sustainable for a loop firing every 4 hours. Engineering is
  # the one job worth paying Opus rates for; everything else steps down.
  # Per-agent max_usd_per_run / max_tokens_per_run, added 27 Sep 2026, sized from
  # real measured runs, not guessed. Where an agent has no override below, it
  # falls back to budget.max_usd_per_run / budget.max_tokens_per_run: that is a
  # deliberate "no real usage data yet" choice for that agent, not an oversight.
  # See AppConfig.max_usd_per_run_for / max_tokens_per_run_for, which every
  # enforcement path resolves through.
  planner:
    model: claude-sonnet-5
    tools: []
    max_turns: 6
    timeout_seconds: 300
    # A planning decision is closer to classification than open-ended reasoning.
    effort: low
    # Observed 27 Sep: a real, successful planning cycle used 58,543 tokens and
    # cost $0.10826. ~1.7x tokens and ~2.3x dollars of headroom over that,
    # rounded to a clean figure: real room for a bigger plan, still nowhere
    # near the 200k/$3.00 global default that assumes an open-ended worker.
    max_usd_per_run: 0.25
    max_tokens_per_run: 100_000

  dedup_judge:
    model: claude-haiku-4-5
    tools: []
    max_turns: 2
    timeout_seconds: 120
    # No effort here: Haiku 4.5 does not support the effort parameter at all,
    # unlike Sonnet/Opus tier models. Setting one would 400 every judge call.
    # Haiku's cost variance is already low since it gets no adaptive thinking
    # by default (only Sonnet/Opus tier think unless explicitly configured).
    # No real usage data yet (never reached in either live dry run), so no
    # override: inherits the global default rather than a guessed figure.

  engineer:
    model: claude-opus-5
    # Scoped to the task's own workspace directory. No network, no push.
    # A commit becomes an approval holding the diff, never a direct push.
    tools: [Read, Write, Edit, Glob, Grep, Bash]
    max_turns: 40
    timeout_seconds: 900
    # No engineer run completed today (blocked before dispatch by the analyst's
    # halt), so this is sized from the previous dry run's real numbers instead:
    # two Opus-tier runs at 351k and 471k tokens, $0.64376 and $0.55168, neither
    # a natural finish (both cut off externally by the account running out of
    # credit). max_tokens_per_run is set to ~1.6x the larger of those two,
    # genuine headroom beyond anything actually observed rather than a number
    # that would have clipped either run again. max_usd_per_run projects the
    # higher of the two observed $/token rates out to that same token ceiling
    # and rounds up for margin.
    max_usd_per_run: 2.00
    max_tokens_per_run: 750_000

  marketer:
    model: claude-sonnet-5
    # Drafts only. Publishing is an irreversible action and goes to the gate.
    tools: [Read, Write, WebSearch]
    max_turns: 20
    timeout_seconds: 600
    # No real usage data yet (never dispatched in either live dry run), so no
    # override: inherits the global default rather than a guessed figure.

  support:
    model: claude-haiku-4-5
    # Reads context and drafts replies. Sending is an irreversible action.
    tools: [Read, Grep]
    max_turns: 15
    timeout_seconds: 600
    # No real usage data yet (never dispatched in either live dry run), so no
    # override: inherits the global default rather than a guessed figure. On
    # Haiku, with only Read/Grep, it should end up tight in practice regardless.

  analyst:
    model: claude-sonnet-5
    # Reads the database and the web, writes findings back into the task result.
    tools: [Read, Glob, Grep, WebSearch, WebFetch]
    max_turns: 25
    timeout_seconds: 600
    # Updated 28 Sep after running all five single-source upstream-monitoring
    # tasks (see the wiki for the full spread). Three completed cleanly (DVLA
    # 300,033 tok/$0.22569; CheckCarDetails 194,918 tok/$0.13979; gov.im
    # 416,116 tok/$0.23534). Two hit the 600,000-token ceiling and were cut off
    # (MOT at 606,901; Chrystals at 613,726) despite both being legitimate,
    # narrowly-scoped work, not runaway exploration -- catching 40% of
    # genuinely single-source tasks means the ceiling was too tight, not that
    # the tasks were too broad. max_tokens_per_run raised to 900,000: real
    # headroom past both cutoff points, still nowhere near the original
    # 1.8M-token broad-scope run this whole split was designed to avoid.
    # max_usd_per_run stays at $1.00 as the real backstop: every single-source
    # run so far, including both that hit the token ceiling, has stayed well
    # under it ($0.14-$0.31), because cache_read/cache_write dominate over
    # fresh input/output for this cache-heavy agent -- tokens bind first here,
    # dollars are the belt-and-braces layer underneath, not the tight one.
    max_usd_per_run: 1.00
    max_tokens_per_run: 900_000

pricing:
  # USD per million tokens. Input and output are list rates.
  # cache_read is 0.1x input, cache_write is 1.25x input.
  # Check against https://claude.com/pricing before trusting a bill to these.
  claude-opus-5:
    input: 5.00
    output: 25.00
    cache_read: 0.50
    cache_write: 6.25

  claude-sonnet-5:
    input: 2.00
    output: 10.00
    cache_read: 0.20
    cache_write: 2.50

  claude-haiku-4-5:
    input: 1.00
    output: 5.00
    cache_read: 0.10
    cache_write: 1.25
