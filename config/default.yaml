# Polska orchestrator config.
#
# Tunables only. No credentials: those come from the environment, see .env.example.
# Validated on load by polska.config.appconfig.AppConfig, so a typo fails at startup
# rather than at 3am on the fourth tick.

scheduler:
  enabled: true
  interval_hours: 4
  jitter_seconds: 300
  run_on_start: false
  coalesce: true

limits:
  max_concurrent_tasks: 2
  max_tasks_per_day: 12
  max_tasks_per_tick: 5
  max_attempts: 3
  task_timeout_seconds: 900

budget:
  # Hard stops. Crossing one halts the scheduler and writes a BudgetHalt row.
  # Nothing degrades, nothing retries past a limit.
  #
  # Denominated in dollars, not tokens: an Opus token and a Haiku token do not
  # cost the same, so a raw cross-model token sum would make a ceiling
  # meaningless. max_tokens_per_run is the one token figure left, and it is a
  # same-model, single-run output-size safety net, never used to price anything.
  max_tokens_per_run: 200000
  max_usd_per_run: 3.0
  max_usd_per_day: 10.0
  max_usd_per_company: 250.0
  # Frozen into each run at write time so a rate change never rewrites history.
  usd_to_gbp: 0.79

dedup:
  lookback_days: 14
  high_threshold: 90
  low_threshold: 60
  judge_model: claude-haiku-4-5
  judge_enabled: true

approvals:
  # Anything on this list writes a preview and stops. It never executes directly.
  irreversible_actions:
    - email.send
    - social.publish
    - git.push_default_branch
    - payment.charge
    - contact.third_party
  # Ships empty on purpose. Adding an entry here is a decision to let an agent act
  # on the world without being asked. Every entry must also appear above.
  auto_approve: []
  expiry_hours: 72
  # An action type nobody classified is treated as irreversible. Fail closed.
  unknown_action_is_irreversible: true

integrations:
  default_adapter: dry_run
  # Global off switch. While true, an approved action is still only logged.
  # Phase 1 has no real adapters, so this stays true until they exist.
  force_dry_run: true

agents:
  # Every agent names its model and its tool allowlist explicitly. No agent
  # inherits a tool, and an empty list means it reasons but touches nothing.
  #
  # Model tiers set by Javier on 24 Sep 2026: Opus everywhere was the safe first
  # default, but not sustainable for a loop firing every 4 hours. Engineering is
  # the one job worth paying Opus rates for; everything else steps down.
  planner:
    model: claude-sonnet-5
    tools: []
    max_turns: 6
    timeout_seconds: 300

  dedup_judge:
    model: claude-haiku-4-5
    tools: []
    max_turns: 2
    timeout_seconds: 120

  engineer:
    model: claude-opus-5
    # Scoped to the task's own workspace directory. No network, no push.
    # A commit becomes an approval holding the diff, never a direct push.
    tools: [Read, Write, Edit, Glob, Grep, Bash]
    max_turns: 40
    timeout_seconds: 900

  marketer:
    model: claude-sonnet-5
    # Drafts only. Publishing is an irreversible action and goes to the gate.
    tools: [Read, Write, WebSearch]
    max_turns: 20
    timeout_seconds: 600

  support:
    model: claude-haiku-4-5
    # Reads context and drafts replies. Sending is an irreversible action.
    tools: [Read, Grep]
    max_turns: 15
    timeout_seconds: 600

  analyst:
    model: claude-sonnet-5
    # Reads the database and the web, writes findings back into the task result.
    tools: [Read, Glob, Grep, WebSearch, WebFetch]
    max_turns: 25
    timeout_seconds: 600

pricing:
  # USD per million tokens. Input and output are list rates.
  # cache_read is 0.1x input, cache_write is 1.25x input.
  # Check against https://claude.com/pricing before trusting a bill to these.
  claude-opus-5:
    input: 5.00
    output: 25.00
    cache_read: 0.50
    cache_write: 6.25

  claude-sonnet-5:
    input: 2.00
    output: 10.00
    cache_read: 0.20
    cache_write: 2.50

  claude-haiku-4-5:
    input: 1.00
    output: 5.00
    cache_read: 0.10
    cache_write: 1.25
