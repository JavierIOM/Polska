[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "polska"
version = "0.4.2"
description = "Autonomous company operator: an orchestrator that plans work and dispatches agents on a schedule."
requires-python = ">=3.12"
license = { text = "Proprietary" }

dependencies = [
    "sqlalchemy>=2.0.36",
    "alembic>=1.14.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "pyyaml>=6.0.2",
    "python-dotenv>=1.0.1",
    # The runner imports this directly: it is how every agent invocation actually
    # happens, not an optional extra. It shells out to the Claude Code CLI, which the
    # package bundles, so the Docker image needs no separate Node/CLI install.
    "claude-agent-sdk>=0.2.159",
    # The orchestrator's dedup pass imports this directly for the deterministic
    # fuzzy-match half of the dedup design.
    "rapidfuzz>=3.10.0",
    # The scheduler imports this directly from phase 3 onwards.
    "apscheduler>=3.11.0",
]

[project.optional-dependencies]
# Phase 4: the dashboard.
runtime = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "jinja2>=3.1.4",
    "itsdangerous>=2.2.0",
    "argon2-cffi>=23.1.0",
    # FastAPI's Form(...) dependency (the login form) needs this at runtime even
    # though nothing imports it by name.
    "python-multipart>=0.0.12",
]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
    "ruff>=0.8.0",
    # Windows has no IANA tz database; alembic's UTC timestamps need it.
    "tzdata>=2024.2; sys_platform == 'win32'",
    # FastAPI's own TestClient is a thin wrapper over this.
    "httpx>=0.27.0",
]

[project.scripts]
polska-cli = "polska.cli:main"
polska-dashboard = "polska.dashboard.server:run"

[tool.hatch.build.targets.wheel]
packages = ["src/polska"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = ["error::DeprecationWarning"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Autogenerated by alembic. Rewrapping it by hand just loses the next time
# a revision is generated.
"migrations/versions/*" = ["E501"]
# Asserting a named constant against a computed value reads better than the
# inverse, which is what SIM300 would rewrite it to.
"tests/*" = ["SIM300"]
# Depends(...) as an argument default is FastAPI's own dependency-injection
# pattern, not the antipattern B008 exists to catch (a mutable default built
# once at import time). FastAPI calls it fresh per request.
"src/polska/dashboard/*" = ["B008"]
